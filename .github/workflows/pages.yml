name: deploy-pages

# Déploie le build Vite sur GitHub Pages dès qu'un commit arrive sur `main`
# (ou manuellement via le bouton « Run workflow »).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clone le dépôt
        uses: actions/checkout@v4

      - name: Node 22 (requis par Vite 8)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installe les dépendances (verrouillées)
        run: npm ci

      - name: Run test suite (G0.6.2 — obligatoire avant déploiement)
        run: npm test

      - name: Build de production
        run: npm run build

      - name: Vérifier que SW VERSION est concrète (jamais placeholder)
        run: |
          if grep -q '__SW_VERSION__' dist/sw.js; then
            echo "ERREUR : dist/sw.js contient __SW_VERSION__ — build-sw.mjs a échoué"
            exit 1
          fi
          grep "const VERSION" dist/sw.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publie dist/
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Déploie
        id: deployment
        uses: actions/deploy-pages@v4