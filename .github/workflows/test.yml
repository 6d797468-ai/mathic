name: test

# Preuve CI Kali : tests + build sur toute PR et sur les itérations de travail
# (branches kali/*) — déclenche les checks liés à chaque commit (ex. le diff
# d'une PR kali/v4-runtime → main). Reste sans secret, lecture seule.

on:
  pull_request:
  push:
    branches:
      - 'kali/*'

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build