name: test

# Pipeline de tests obligatoire — exécuté sur chaque push et PR.
# Gate G0.6.1 : les tests doivent passer avant tout merge sur main.

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build (verify no broken imports)
        run: npm run build

      - name: Verify SW VERSION is concrete (not placeholder)
        run: |
          if grep -q '__SW_VERSION__' dist/sw.js; then
            echo "ERREUR : dist/sw.js contient encore __SW_VERSION__ !"
            echo "build-sw.mjs n'a pas été exécuté correctement."
            exit 1
          fi
          echo "✅ SW VERSION :"
          grep "const VERSION" dist/sw.js
