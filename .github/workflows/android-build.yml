name: build-android

on:
  push:
    branches: [main, "kali/*"]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web & copy Capacitor
        run: npm run build:android

      # cap sync (copy + update) régénère le wrapper plugins Cordova
      # (capacitor-cordova-android-plugins) et les assets runtime — dossier
      # gitignoré par convention Capacitor, obligatoire pour Gradle.
      - name: Capacitor sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ./android
        run: bash ./gradlew assembleDebug

      - name: Generate Release Build Manifest
        run: |
          apk_path="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$apk_path" ]; then
            sha256=$(sha256sum "$apk_path" | awk '{print $1}')
            commit_sha=${GITHUB_SHA}
            branch_name=${GITHUB_REF#refs/heads/}
            
            cat <<EOF > release-build-manifest.json
          {
            "commit": "$commit_sha",
            "branch": "$branch_name",
            "package": "com.mathic.game",
            "versionName": "1.0",
            "versionCode": 1,
            "artifact": "app-debug.apk",
            "sha256": "$sha256",
            "buildType": "debug"
          }
          EOF
          else
            echo "APK not found!"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathic-android-e3
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            release-build-manifest.json
          if-no-files-found: error