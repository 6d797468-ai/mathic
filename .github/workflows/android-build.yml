name: build-android

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build web & copy Capacitor
        run: npm run build:android

      # cap sync (copy + update) régénère le wrapper plugins Cordova
      # (capacitor-cordova-android-plugins) et les assets runtime — dossier
      # gitignoré par convention Capacitor, obligatoire pour Gradle.
      - name: Capacitor sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ./android
        run: bash ./gradlew assembleDebug

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MATHIC-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error